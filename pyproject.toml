[project]
name = "beam"
version = "0.1.0"
description = "A screen reader mod for BeamNG.drive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "asyncio>=4.0.0",
    "comtypes>=1.4.15",
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "mss>=9.0.1",
    "numpy>=2.3.3",
    "ordered-set>=4.1.0",
    "sounddevice>=0.5.2",
    "wxpython>=4.2.3",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "ipython>=9.10.1",
    "nuitka>=4.0",
    "h5py>=3.8.0",  # build-time only: bake_hrtf.py extracts the SOFA file into .npz
]
