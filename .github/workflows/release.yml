# Builds beamtel.exe, packages the Lua/JS mod, and publishes the release bundle.
#
# The asset name is deliberately fixed (build.py's BUNDLE_NAME, no date), so
#   https://github.com/ironcross32/BeamNG-Accessibility-Mod/releases/latest/download/BeamNG_accessibility_mod.zip
# is a permanent link to the newest tagged build.
#
# Must run on Windows: the output is a Nuitka onefile .exe with a UAC manifest.
name: Build and Release

on:
  push:
    tags: ['v*']
  # Manual runs build and upload the same bundle as a workflow artifact, but
  # publish no release -- so the pipeline can be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # windows-latest ships MSVC, which is Nuitka's default there. --clang would
      # make it download a winlibs toolchain on every run; flip this to "clang"
      # only if the MSVC output ever turns out to differ in a way that matters.
      BEAM_COMPILER: msvc
      UPX_VERSION: 5.2.0

    steps:
      - uses: actions/checkout@v4

      # bng_mod/ is a directory junction locally but its files are tracked, so
      # the checkout materialises it as a real directory and build.py's
      # ensure_mod_junction()/package_mod() work against it unchanged.
      # hrtf_kemar_horizontal.npz is committed too, so bake_hrtf.py and h5py are
      # never needed here.

      # APP_VERSION is the only thing a shipped build compares against the release
      # tag, and it is maintained by hand. Left to drift it does not fail loudly:
      # every client simply concludes it is already up to date, and the release
      # reaches nobody. Checked before the build so a mismatch costs seconds.
      - name: Check APP_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $line = Select-String -Path updater.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $line) { throw "APP_VERSION not found in updater.py" }
          $ver = $line.Matches[0].Groups[1].Value
          if ($ver -ne $tag) {
            throw "updater.py APP_VERSION is $ver but the tag is $tag. Bump APP_VERSION and re-tag."
          }
          Write-Host "APP_VERSION $ver matches tag $tag"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # Includes the dev group, which is where nuitka lives.
        run: uv sync

      - name: Install UPX
        shell: pwsh
        run: |
          $ver = $env:UPX_VERSION
          $name = "upx-$ver-win64"
          curl.exe -L -o upx.zip "https://github.com/upx/upx/releases/download/v$ver/$name.zip"
          Expand-Archive -Path upx.zip -DestinationPath "$env:RUNNER_TEMP" -Force
          $bin = Join-Path $env:RUNNER_TEMP "$name\upx.exe"
          if (-not (Test-Path $bin)) { throw "UPX not found at $bin" }
          "BEAM_UPX_BINARY=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: uv run python build.py

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamNG_accessibility_mod
          path: build/BeamNG_accessibility_mod.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/BeamNG_accessibility_mod.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
